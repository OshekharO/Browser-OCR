<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser OCR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      body {
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .app-header {
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
        padding: 2.5rem 1rem;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      }
      .upload-box {
        background: #f1f5f9;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        padding: 1.5rem;
        transition: background-color 0.2s, border-color 0.2s;
        cursor: pointer;
      }
      .upload-box.drag-over {
        background: #e0e7ff;
        border-color: #6366f1;
      }
      .preview-thumb {
        max-height: 120px;
        max-width: 180px;
        object-fit: contain;
      }
      textarea {
        resize: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      footer {
        border-top: 1px solid #e5e7eb;
        color: #64748b;
        font-size: 0.875rem;
      }
    </style>
  </head>

  <body>
    <header class="app-header text-center">
      <div class="container">
        <h1 class="display-6 mb-2">Browser OCR</h1>
        <p class="lead mb-0">Private, client-side text extraction</p>
      </div>
    </header>

    <main class="container py-5">
      <div class="row g-4">
        <!-- INPUT -->
        <div class="col-lg-5">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="mb-3">1. Upload & Configure</h5>

              <label class="fw-semibold">Images or PDFs</label>
              <input id="fileInput" type="file" class="form-control" accept="image/*,.pdf" multiple />

              <label class="fw-semibold mt-3">OCR Language</label>
              <select id="languageSelect" class="form-select">
                <option value="eng">English</option>
                <option value="hin">Hindi</option>
                <option value="fra">French</option>
                <option value="spa">Spanish</option>
                <option value="deu">German</option>
                <option value="chi_sim">Chinese</option>
              </select>

              <label class="fw-semibold mt-3">OCR Preset</label>
              <select id="presetSelect" class="form-select">
                <option value="scan">📄 Scanned document</option>
                <option value="screenshot">🖥 Screenshot / UI</option>
                <option value="notes">📝 Notes / handwriting</option>
                <option value="photo">📸 Camera photo</option>
              </select>

              <div id="uploadBox" class="upload-box mt-4 text-center">
                <p class="text-muted mb-2">Drag & drop files here or click to select</p>
                <div id="previewList" class="d-flex flex-wrap gap-2 justify-content-center"></div>
              </div>

              <details class="mt-3">
                <summary class="fw-semibold">Advanced</summary>
                <div class="form-check mt-2">
                  <input id="downscaleToggle" class="form-check-input" type="checkbox" checked />
                  <label class="form-check-label"> Enable smart image downscaling (recommended) </label>
                </div>
              </details>

              <div class="d-flex gap-2 mt-4">
                <button id="extractBtn" class="btn btn-primary flex-grow-1" disabled>
                  <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                  Extract Text
                </button>
                <button id="clearBtn" class="btn btn-outline-secondary d-none">Clear</button>
                <button id="cancelBtn" class="btn btn-outline-danger d-none">Cancel</button>
              </div>

              <div class="progress mt-3 d-none" style="height: 6px">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"></div>
              </div>

              <div
                id="statusText"
                class="small mt-2"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              ></div>
            </div>
          </div>
        </div>

        <!-- OUTPUT -->
        <div class="col-lg-7">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="mb-3">2. Extracted Text</h5>

              <textarea
                id="resultText"
                class="form-control flex-grow-1 mb-2"
                rows="10"
                placeholder="OCR result will appear here…"
              ></textarea>

              <div class="d-flex justify-content-between text-muted small mb-3 px-1">
                <span>Words: <strong id="wordCount">0</strong></span>
                <span>Characters: <strong id="charCount">0</strong></span>
              </div>

              <div class="d-flex gap-2">
                <button id="copyBtn" class="btn btn-outline-primary" disabled>Copy</button>
                <button id="cleanBtn" class="btn btn-outline-secondary" disabled>Clean Text</button>
                <button id="downloadBtn" class="btn btn-outline-success" disabled>Download</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between text-center text-md-start gap-2">
        <div>
          <strong>Browser OCR</strong>
          <div>All processing happens in your browser.</div>
        </div>
        <div>Powered by Tesseract.js · No uploads · No tracking</div>
      </div>
    </footer>

    <!-- PDF.js (STABLE UMD) -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    </script>

    <!-- Tesseract -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>

    <script>
      /* ===================== STATE ===================== */
      let cancelRequested = false;
      let previewURLs = [];

      /* ===================== DOM ===================== */
      const fileInput = document.getElementById("fileInput");
      const uploadBox = document.getElementById("uploadBox");
      const previewList = document.getElementById("previewList");
      const extractBtn = document.getElementById("extractBtn");
      const clearBtn = document.getElementById("clearBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const spinner = document.getElementById("spinner");
      const statusText = document.getElementById("statusText");
      const resultText = document.getElementById("resultText");
      const progressBar = document.getElementById("progressBar");
      const progressWrap = progressBar.parentElement;
      const languageSel = document.getElementById("languageSelect");
      const presetSel = document.getElementById("presetSelect");
      const downscaleToggle = document.getElementById("downscaleToggle");
      const copyBtn = document.getElementById("copyBtn");
      const cleanBtn = document.getElementById("cleanBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const wordCount = document.getElementById("wordCount");
      const charCount = document.getElementById("charCount");

      const PRESET_STATUS = {
        scan: "Deskewing → Enhancing contrast → Recognizing text",
        screenshot: "Optimizing UI text → Recognizing",
        notes: "Enhancing handwriting → Recognizing",
        photo: "Normalizing photo → Recognizing",
      };

      /* ===================== HELPERS ===================== */
      async function downscaleImage(file, maxWidth = 1600) {
        const url = URL.createObjectURL(file);
        try {
          const img = new Image();
          img.src = url;
          await img.decode();

          if (img.naturalWidth <= maxWidth) {
            return file;
          }

          const scale = maxWidth / img.naturalWidth;
          const canvas = document.createElement("canvas");
          canvas.width = maxWidth;
          canvas.height = img.naturalHeight * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const blob = await new Promise((res) => canvas.toBlob((b) => res(b), "image/jpeg", 0.9));
          // Clean up canvas backing store references to avoid memory retaining
          canvas.width = 0;
          canvas.height = 0;
          return blob;
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      async function extractTextFromPdf(pdf) {
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          text += content.items.map((it) => it.str).join(" ") + "\n";
        }
        return text.trim();
      }

      async function renderPdfPageToImage(pdf, pageNum) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport }).promise;

        const blob = await new Promise((res) => canvas.toBlob((b) => res(b), "image/png"));
        // Clean up canvas dimensions to release canvas backing buffer memory immediately
        canvas.width = 0;
        canvas.height = 0;
        return blob;
      }

      /* ===================== PREVIEW & DRAG-DROP ===================== */
      function renderPreviews(files) {
        previewURLs.forEach(URL.revokeObjectURL);
        previewURLs = [];
        previewList.innerHTML = "";

        if (!files || !files.length) {
          extractBtn.disabled = true;
          clearBtn.classList.add("d-none");
          return;
        }

        [...files].forEach((f) => {
          if (f.type.startsWith("image/")) {
            const url = URL.createObjectURL(f);
            previewURLs.push(url);
            const img = document.createElement("img");
            img.src = url;
            img.className = "preview-thumb rounded";
            previewList.appendChild(img);
          } else {
            const badge = document.createElement("div");
            badge.className = "badge bg-secondary align-self-center p-2";
            badge.textContent = `PDF: ${f.name}`;
            previewList.appendChild(badge);
          }
        });

        extractBtn.disabled = false;
        clearBtn.classList.remove("d-none");
      }

      fileInput.onchange = (e) => {
        renderPreviews(e.target.files);
      };

      uploadBox.onclick = (e) => {
        if (e.target.tagName !== "INPUT") {
          fileInput.click();
        }
      };

      uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("drag-over");
      });

      uploadBox.addEventListener("dragleave", (e) => {
        e.preventDefault();
        uploadBox.classList.remove("drag-over");
      });

      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadBox.classList.remove("drag-over");
        if (e.dataTransfer.files && e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          renderPreviews(fileInput.files);
        }
      });

      clearBtn.onclick = () => {
        fileInput.value = "";
        renderPreviews([]);
        statusText.textContent = "Cleared files.";
      };

      /* ===================== OCR ===================== */
      extractBtn.onclick = async () => {
        const files = [...fileInput.files];
        if (!files.length) return;

        cancelRequested = false;
        extractBtn.disabled = true;
        cancelBtn.classList.remove("d-none");
        spinner.classList.remove("d-none");
        progressWrap.classList.remove("d-none");
        progressBar.style.width = "0%";
        statusText.setAttribute("aria-busy", "true");
        statusText.textContent = "Preparing OCR…";

        const selectedLang = languageSel.value;
        let totalSteps = 0;

        for (const f of files) {
          if (f.type === "application/pdf") {
            try {
              const pdf = await pdfjsLib.getDocument(await f.arrayBuffer()).promise;
              totalSteps += pdf.numPages;
            } catch (err) {
              console.error(`Error reading PDF header for ${f.name}:`, err);
              totalSteps += 1;
            }
          } else {
            totalSteps++;
          }
        }

        let completed = 0;
        const startTime = Date.now();
        let output = "";
        let worker = null;

        const getOrCreateWorker = async () => {
          if (!worker) {
            worker = await Tesseract.createWorker(selectedLang);
          }
          return worker;
        };

        try {
          for (const file of files) {
            if (cancelRequested) break;

            if (file.type === "application/pdf") {
              statusText.textContent = "Analyzing PDF…";
              let pdf = null;
              try {
                pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
              } catch (err) {
                console.error(`Error loading PDF ${file.name}:`, err);
                output += `[Error loading PDF ${file.name}: ${err.message || err}]\n\n`;
                completed++;
                progressBar.style.width = `${Math.round((completed / Math.max(totalSteps, 1)) * 100)}%`;
                continue;
              }

              const text = await extractTextFromPdf(pdf);

              if (text.length > 50) {
                output += text + "\n\n";
                completed += pdf.numPages;
                progressBar.style.width = `${Math.round((completed / Math.max(totalSteps, 1)) * 100)}%`;
                continue;
              }

              for (let p = 1; p <= pdf.numPages; p++) {
                if (cancelRequested) break;

                try {
                  const currentWorker = await getOrCreateWorker();

                  const elapsed = (Date.now() - startTime) / 1000;
                  const overall = (completed / Math.max(totalSteps, 1)) * 100;
                  const remaining = elapsed * ((100 - overall) / Math.max(overall, 1));

                  statusText.textContent =
                    `${PRESET_STATUS[presetSel.value]} · PDF page ${p}/${pdf.numPages} · ~${Math.ceil(remaining)}s left`;

                  const img = await renderPdfPageToImage(pdf, p);
                  const res = await currentWorker.recognize(img);
                  output += res.data.text.trim() + "\n\n";
                } catch (err) {
                  console.error(`Error processing PDF page ${p}:`, err);
                  output += `[Error processing PDF page ${p}: ${err.message || err}]\n\n`;
                } finally {
                  completed++;
                  progressBar.style.width = `${Math.round((completed / Math.max(totalSteps, 1)) * 100)}%`;
                }
              }
              continue;
            }

            try {
              let input = downscaleToggle.checked ? await downscaleImage(file) : file;
              const currentWorker = await getOrCreateWorker();

              const elapsed = (Date.now() - startTime) / 1000;
              const overall = (completed / Math.max(totalSteps, 1)) * 100;
              const remaining = elapsed * ((100 - overall) / Math.max(overall, 1));
              statusText.textContent =
                `${PRESET_STATUS[presetSel.value]} · ~${Math.ceil(remaining)}s left`;

              const res = await currentWorker.recognize(input);
              output += res.data.text.trim() + "\n\n";
            } catch (err) {
              console.error(`Error processing file ${file.name}:`, err);
              output += `[Error processing ${file.name}: ${err.message || err}]\n\n`;
            } finally {
              completed++;
              progressBar.style.width = `${Math.round((completed / Math.max(totalSteps, 1)) * 100)}%`;
            }
          }
        } finally {
          // Ensure worker is terminated to free memory and WebWorker resources
          if (worker) {
            try {
              await worker.terminate();
            } catch (e) {
              console.error("Error terminating worker:", e);
            }
            worker = null;
          }
        }

        previewURLs.forEach(URL.revokeObjectURL);
        previewURLs = [];
        previewList.innerHTML = "";

        spinner.classList.add("d-none");
        progressWrap.classList.add("d-none");
        cancelBtn.classList.add("d-none");
        extractBtn.disabled = false;
        statusText.removeAttribute("aria-busy");

        if (cancelRequested) {
          statusText.textContent = "OCR cancelled.";
        } else {
          resultText.value = output || "No text detected.";
          updateMetrics();
          statusText.textContent = "OCR completed successfully.";
        }
      };

      /* ===================== TEXT METRICS & CLEANUP ===================== */
      function updateMetrics() {
        const val = resultText.value;
        const trimmed = val.trim();
        const words = trimmed ? trimmed.split(/\s+/).filter(Boolean).length : 0;
        wordCount.textContent = words.toLocaleString();
        charCount.textContent = val.length.toLocaleString();

        const hasText = val.length > 0;
        copyBtn.disabled = !hasText;
        cleanBtn.disabled = !hasText;
        downloadBtn.disabled = !hasText;
      }

      resultText.addEventListener("input", updateMetrics);

      cleanBtn.onclick = () => {
        if (!resultText.value) return;
        const cleaned = resultText.value
          .split("\n")
          .map((line) => line.replace(/[ \t]+/g, " ").trim())
          .join("\n")
          .replace(/\n{3,}/g, "\n\n")
          .trim();

        resultText.value = cleaned;
        updateMetrics();
        statusText.textContent = "Text cleaned (whitespace and empty lines removed).";
      };

      /* ===================== ACTIONS ===================== */
      cancelBtn.onclick = () => (cancelRequested = true);

      copyBtn.onclick = async () => {
        await navigator.clipboard.writeText(resultText.value);
        statusText.textContent = "Copied!";
      };

      downloadBtn.onclick = () => {
        const blob = new Blob([resultText.value], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ocr.txt";
        a.click();
      };

      /* ===================== SHORTCUTS ===================== */
      document.addEventListener("keydown", (e) => {
        const targetTag = e.target ? e.target.tagName : "";
        const isEditing = targetTag === "INPUT" || targetTag === "TEXTAREA" || e.target.isContentEditable;

        if (e.key === "Enter" && !extractBtn.disabled && !isEditing) {
          extractBtn.click();
        }
        if (e.key === "Escape") {
          cancelBtn.click();
        }
        // Bug fix: Do not override standard browser copy (Ctrl+C / Cmd+C) if the user is focused on an input/textarea or has selected text on screen
        if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C")) {
          const selection = window.getSelection ? window.getSelection().toString() : "";
          if (!isEditing && !selection && resultText.value) {
            navigator.clipboard.writeText(resultText.value);
            statusText.textContent = "Copied!";
          }
        }
      });
    </script>
  </body>
</html>
